const list=document.getElementById('list'),q=document.getElementById('q'),v=document.getElementById('lyric');let fs=17;let active=null;
function norm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function render(){const term=norm(q.value);list.innerHTML='';const matches=songs.filter(s=>norm(s.title).includes(term)||norm(s.content).includes(term));for(const song of matches){const b=document.createElement('button');b.className='item'+(song===active?' sel':'');const strong=document.createElement('strong');strong.textContent=song.title;b.appendChild(strong);const meta=document.createElement('small');meta.textContent=' · '+(song.key||'');b.appendChild(meta);b.onclick=()=>openSong(song);list.appendChild(b)}if(!matches.length)list.textContent='Nenhuma música encontrada'}
function openSong(song){active=song;document.getElementById('title').textContent=song.title;document.getElementById('tone').textContent='Tom: '+(song.key||'não informado');v.textContent=song.content||'Cifra não disponível';document.body.classList.add('reading');document.getElementById('view').scrollTop=0;render()}
function goBack(){document.body.classList.remove('reading');render()}
function changeSize(delta){fs=Math.max(12,Math.min(35,fs+delta));v.style.fontSize=fs+'px'}
q.oninput=()=>{document.body.classList.remove('reading');render()};render();
</script></body></html>
